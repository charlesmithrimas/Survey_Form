
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Survey Form</title>
</head>
<body>

    <h1>Survey Form</h1>
    <p>Please fill out this form to share your feedback and experience.</p>

    <form action="#" method="post">

        <h2>User Information</h2>

        <label for="full-name">Full Name:</label>
        <input type="text" id="full-name" name="full-name" required>
        <br><br>

        <label for="email">Email Address:</label>
        <input type="email" id="email" name="email" required>
        <br><br>

        <h2>How satisfied are you with our service?</h2>

        <input type="radio" id="very-satisfied" name="satisfaction" value="Very Satisfied">
        <label for="very-satisfied">Very Satisfied</label>
        <br>

        <input type="radio" id="satisfied" name="satisfaction" value="Satisfied">
        <label for="satisfied">Satisfied</label>
        <br>

        <input type="radio" id="neutral" name="satisfaction" value="Neutral">
        <label for="neutral">Neutral</label>
        <br>

        <input type="radio" id="dissatisfied" name="satisfaction" value="Dissatisfied">
        <label for="dissatisfied">Dissatisfied</label>
        <br>

        <input type="radio" id="very-dissatisfied" name="satisfaction" value="Very Dissatisfied">
        <label for="very-dissatisfied">Very Dissatisfied</label>
        <br><br>

        <h2>What features do you value most?</h2>

        <input type="checkbox" id="quality" name="features" value="Quality">
        <label for="quality">Quality</label>
        <br>

        <input type="checkbox" id="customer-service" name="features" value="Customer Service">
        <label for="customer-service">Customer Service</label>
        <br>

        <input type="checkbox" id="price" name="features" value="Affordable Price">
        <label for="price">Affordable Price</label>
        <br>

        <input type="checkbox" id="accessibility" name="features" value="Accessibility">
        <label for="accessibility">Accessibility</label>
        <br><br>

        <h2>User Role Selection</h2>

        <label for="role">What best describes you?</label>
        <select id="role" name="role">
            <option value="">Select your role</option>
            <option value="Student">Student</option>
            <option value="Professional">Professional</option>
            <option value="Hobbyist">Hobbyist</option>
            <option value="Other">Other</option>
        </select>
        <br><br>

        <h2>Additional Comments</h2>

        <label for="comments">Additional comments or suggestions?</label>
        <br>
        <textarea id="comments" name="comments" rows="5" cols="40"></textarea>
        <br><br>

        <button type="submit">Submit Survey</button>

    </form>

</body>
</html>
